name: RadioRoom Windows build and release
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: radioroom-${{ github.ref }}
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Install verified secret scanner
        shell: pwsh
        run: |
          $tools=Join-Path $env:RUNNER_TEMP 'gitleaks'
          New-Item -ItemType Directory -Force $tools | Out-Null
          $archive=Join-Path $tools 'gitleaks.zip'
          Invoke-WebRequest 'https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_windows_x64.zip' -OutFile $archive
          if((Get-FileHash $archive -Algorithm SHA256).Hash -ne 'D29144DEFF3A68AA93CED33DDDF84B7FDC26070ADD4AA0F4513094C8332AFC4E'){throw 'Scanner checksum mismatch'}
          Expand-Archive -LiteralPath $archive -DestinationPath $tools
          $tools >> $env:GITHUB_PATH
      - name: Scan tracked source and history
        shell: pwsh
        run: |
          gitleaks git . --log-opts=--all --ignore-gitleaks-allow --redact=100 --no-banner
          if($LASTEXITCODE -ne 0){throw 'Secret scan failed'}
      - name: Build VST3 and standalone
        shell: pwsh
        run: ./Build-source.ps1
      - name: Verify DSP, automation, transport, editor and lifecycle
        shell: pwsh
        run: ./scripts/Test-RadioRoom.ps1
      - name: Package checked build
        shell: pwsh
        run: |
          if($env:GITHUB_REF.StartsWith('refs/tags/')){python scripts/Package-RadioRoom.py --tag $env:GITHUB_REF_NAME}
          else{python scripts/Package-RadioRoom.py}
          if($LASTEXITCODE -ne 0){throw 'Packaging failed'}
          Expand-Archive -LiteralPath (Get-ChildItem dist/RadioRoom-*-Windows-x64.zip).FullName -DestinationPath tests/package
          ./scripts/Test-Updates.ps1 -PackageRoot (Join-Path $PWD 'tests/package/RadioRoom') -TestRoot (Join-Path $PWD 'tests/update-policy')
          gitleaks dir dist --max-archive-depth 3 --ignore-gitleaks-allow --redact=100 --no-banner
          if($LASTEXITCODE -ne 0){throw 'Package secret scan failed'}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RadioRoom-Windows-x64
          path: |
            dist/*.zip
            dist/SHA256SUMS.txt
            dist/manifest.json
          if-no-files-found: error
          retention-days: 14
      - name: Keep diagnostics
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: RadioRoom-verification
          path: |
            tests/*report.json
            tests/host-stages.txt
            tests/output/*skin*.png
            radioroom-error.txt
          if-no-files-found: warn
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: RadioRoom-Windows-x64
          path: release-assets
      - name: Publish only fully uploaded and verified assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/Publish-Release.py --tag "$RELEASE_TAG" --directory release-assets
